name: Runtime bug report
description: Report a Ruffle Handheld launcher, input, cursor, setup, performance or multi-file problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: Ruffle Handheld version}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Device / CFW / SoC}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Setup, Launch, Controls, Cursor, Performance, Multi-file, Theme, Other]
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What happened?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs / screenshots}
