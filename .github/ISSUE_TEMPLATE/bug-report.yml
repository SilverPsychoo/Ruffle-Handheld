name: "Runtime bug report"
description: "Report a launcher, input, cursor, setup, performance, theme or multi-file problem."
title: "[Bug] "
labels:
  - "bug"
body:
  - type: input
    id: version
    attributes:
      label: "Ruffle Handheld version"
      placeholder: "0.8.17"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "Device / CFW / SoC"
      placeholder: "R36S / EmuELEC / RK3326"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Setup"
        - "Launch"
        - "Controls"
        - "Cursor"
        - "Performance"
        - "Multi-file"
        - "Theme"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "What happened?"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / screenshots"
      description: "Attach the matching per-game file from rufflehandheld/logs/, for example Fancy_Pants.swf.log."
