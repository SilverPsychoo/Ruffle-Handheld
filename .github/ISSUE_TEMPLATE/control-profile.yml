name: Control profile submission
description: Propose or improve a per-game controller profile.
title: "[Controls] "
labels: ["controls"]
body:
  - type: input
    id: game
    attributes: {label: Game}
    validations: {required: true}
  - type: input
    id: swf
    attributes: {label: SWF filename}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Device / CFW}
    validations: {required: true}
  - type: textarea
    id: original
    attributes: {label: Original keyboard / mouse controls, description: "Example: arrows move, S jumps, mouse clicks menus."}
    validations: {required: true}
  - type: textarea
    id: mapping
    attributes: {label: Proposed handheld mapping, description: "List D-pad, A/B/X/Y, shoulders, Start/Select, sticks and click button."}
    validations: {required: true}
  - type: textarea
    id: testing
    attributes: {label: What did you test?, description: "State which actions you verified in-game."}
    validations: {required: true}
